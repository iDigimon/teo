name: Publish to PyPI

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  validate:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: validate
    if: ${{ !github.event.release.prerelease }}
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/certbot-dns-teo
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8.0.1
        with:
          name: distributions
          path: dist/
      - name: Separate core and compatibility distributions
        run: |
          mkdir -p dist/core dist/edgeone
          mv dist/certbot_dns_teo-* dist/core/
          mv dist/certbot_dns_tencent_edgeone-* dist/edgeone/
      - name: Publish certbot-dns-teo
        uses: pypa/gh-action-pypi-publish@v1.14.2
        with:
          packages-dir: dist/core/
      - name: Publish certbot-dns-tencent-edgeone
        uses: pypa/gh-action-pypi-publish@v1.14.2
        with:
          packages-dir: dist/edgeone/
